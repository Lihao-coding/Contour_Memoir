<svg xmlns="http://www.w3.org/2000/svg" width="84" height="20" viewBox="0 0 84 20" role="img" aria-label="license MIT">
  <title>license MIT</title>
  <defs>
    <clipPath id="edge"><rect width="84" height="20" rx="4"/></clipPath>
    <linearGradient id="sheen" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".48" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".17"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#edge)">
    <rect width="50" height="20" fill="#4a4e4a"/>
    <rect x="50" width="34" height="20" fill="#865a25"/>
    <rect width="84" height="20" fill="url(#sheen)"/>
  </g>
  <g fill="#fff" font-family="Verdana, Geneva, sans-serif" font-size="11" text-anchor="middle">
    <text x="25" y="14">license</text>
    <text x="67" y="14">MIT</text>
  </g>
</svg>
