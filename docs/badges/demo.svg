<svg xmlns="http://www.w3.org/2000/svg" width="89" height="20" viewBox="0 0 89 20" role="img" aria-label="demo online">
  <title>demo online</title>
  <defs>
    <clipPath id="edge"><rect width="89" height="20" rx="4"/></clipPath>
    <linearGradient id="sheen" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".48" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".17"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#edge)">
    <rect width="43" height="20" fill="#4a4e4a"/>
    <rect x="43" width="46" height="20" fill="#396e5a"/>
    <rect width="89" height="20" fill="url(#sheen)"/>
  </g>
  <g fill="#fff" font-family="Verdana, Geneva, sans-serif" font-size="11" text-anchor="middle">
    <text x="21.5" y="14">demo</text>
    <text x="66" y="14">online</text>
  </g>
</svg>
